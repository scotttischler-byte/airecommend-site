name = "whosthere"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

routes = [
  { pattern = "airecommend.ai/whosthere*", zone_name = "airecommend.ai" },
  { pattern = "www.airecommend.ai/whosthere*", zone_name = "airecommend.ai" },
  { pattern = "airecommend.ai/*", zone_name = "airecommend.ai" },
  { pattern = "www.airecommend.ai/*", zone_name = "airecommend.ai" },
  { pattern = "scotttischler.com/*", zone_name = "scotttischler.com" },
  { pattern = "www.scotttischler.com/*", zone_name = "scotttischler.com" }
]
# Edge install (added only after the pass-through was tested): airecommend.ai/* and scotttischler.com/* routes

[[d1_databases]]
binding = "DB"
database_name = "known-visitor"
database_id = "a086338a-904d-4f46-a993-bcba69bc4cba"

[triggers]
crons = ["17 3 * * *"]
